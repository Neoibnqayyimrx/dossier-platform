name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      # P03: KB retrieval tests exercise real pgvector operators
      # (cosine_distance) that SQLite has no equivalent for, so those tests
      # need an actual Postgres+pgvector instance — this image ships the
      # extension pre-built, unlike the vanilla `postgres` image.
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: dossier
          POSTGRES_PASSWORD: dossier
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dossier"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://dossier:dossier@localhost:5432/dossier
      # No Voyage/Gemini keys in CI — any test exercising the embedding or
      # LLM client goes through the deterministic offline stub instead.
      EMBEDDING_PROVIDER: fake
      LLM_PROVIDER: fake
    steps:
      - uses: actions/checkout@v4

      - name: Install LibreOffice (P07 DOCX->PDF conversion)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libreoffice

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format check (black)
        run: uv run black --check .

      - name: Test
        run: uv run pytest -q
