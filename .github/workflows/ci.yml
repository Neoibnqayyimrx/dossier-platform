name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      # P03: KB retrieval tests exercise real pgvector operators
      # (cosine_distance) that SQLite has no equivalent for, so those tests
      # need an actual Postgres+pgvector instance — this image ships the
      # extension pre-built, unlike the vanilla `postgres` image.
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: dossier
          POSTGRES_PASSWORD: dossier
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dossier"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://dossier:dossier@localhost:5432/dossier
      # No Voyage/Gemini keys in CI — any test exercising the embedding or
      # LLM client goes through the deterministic offline stub instead.
      EMBEDDING_PROVIDER: fake
      LLM_PROVIDER: fake
    steps:
      - uses: actions/checkout@v4

      # python3-uno is NOT optional here despite --no-install-recommends:
      # P1a converts through a persistent LibreOffice listener (unoserver),
      # and unoserver talks to it through `uno` -- a compiled binding that
      # ships with LibreOffice and cannot be pip-installed. Without this
      # package the listener refuses to start and every conversion falls
      # over. See docs/decisions/0002-document-converter.md.
      - name: Install LibreOffice (P07 DOCX->PDF conversion)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice python3-uno

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --all-extras

      # Fail here, with one legible message, rather than as a few hundred
      # confusing conversion failures further down. `uno` is a COMPILED
      # binding built against the distro's Python; if the runner's
      # python3-uno targets a different minor version than the interpreter
      # uv installed above, it cannot be imported and the listener cannot
      # start. The fix when this fires is to match the versions (or set
      # DOCUMENT_CONVERTER=soffice-subprocess and accept the ~6x slowdown).
      - name: Check the LibreOffice UNO binding is importable
        run: |
          PYTHONPATH=/usr/lib/python3/dist-packages uv run python -c "import uno" || {
            echo "::error::python3-uno is not importable by this interpreter."
            echo "python3-uno is built for the distro Python; uv installed a different one."
            python3 -V; ls /usr/lib/python3/dist-packages/uno.py
            exit 1
          }

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format check (black)
        run: uv run black --check .

      - name: Test
        run: uv run pytest -q

      # P16: the target TOC is the contract for "what a finished dossier is".
      # P24e: --strict is ON. It was deliberately off while coverage was
      # incomplete, because --strict exits 1 on any gap and a permanently red
      # build teaches everyone to ignore the build. Every one of the 98 leaves
      # now has a route to production, so the check stops being a progress
      # report and becomes a gate: an applicable leaf with nowhere to come
      # from fails the build that adds it.
      #
      # Without --project this asks whether the PLATFORM can produce or place
      # every leaf, so an uploaded leaf passes on having a slot. Whether a
      # particular FILING has the documents is the other question, and it is
      # asked per project (--project <id>) against a real database.
      - name: Target TOC coverage (gate)
        run: uv run python -m scripts.check_target_toc --strict

  # P25: the frontend had no CI job at all -- vitest and the Playwright
  # happy-path spec were both configured in frontend/package.json and
  # neither ever ran, so a frontend regression could merge with a green
  # tick. Separate job, not a step on `backend`, because it needs Node
  # rather than Python and nothing it does depends on the backend job.
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `npm ci` not `npm install`: installs exactly the lockfile, so CI
      # tests the dependency tree a developer actually has.
      - name: Install dependencies
        run: npm ci

      - name: Lint (eslint)
        run: npm run lint

      - name: Unit tests (vitest)
        run: npm run test

      # The e2e spec drives the REAL backend and skips itself when the API
      # is unreachable (see frontend/e2e/happy-path.spec.ts). No backend is
      # started here, so what this step actually gates is that the app
      # builds and serves -- a broken build, a router error, or a missing
      # dependency fails it. The full journey still has to be run locally
      # against a live stack; wiring that into CI needs Postgres, a seeded
      # KB and provider config, which is its own piece of work.
      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: End-to-end smoke (Playwright)
        run: npm run e2e
