    production: na_statement
    blocked_by: [na_statement_generator, applicability_profile]
    notes: >
      Covers the whole of 4.1-4.3. A generic dossier does not repeat the
      originator's animal studies; it proves bioequivalence instead. The
      package must SAY that. Confirm with ectd/scaffold.py how the empty m4
      folder is currently handled — an empty folder and a declared exclusion
      look very different to an assessor.
    status: unknown

