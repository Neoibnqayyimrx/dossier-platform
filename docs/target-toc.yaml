      LANDED IN P22. Generated by walking BioequivalenceStudy and
      ClinicalEntry, so the listing has no independent existence: remove a
      study and its row goes with it. Every row names the LEAF the report is
      filed at, which is what makes the table navigable rather than
      decorative -- an assessor reads it to find the report.
