  - number: "5.3.1.2"
    module: 5
    title: Comparative BA and bioequivalence (BE) study reports
    applicable: true
    production: uploaded
    notes: >
      THE CRITICAL LEAF. For a multisource filing this single document carries
      the entire scientific argument for approval. Both halves now exist: the
      study report FILE arrives through P18's upload path, and P22's STRUCTURED
      RESULTS generate 1.4.1, populate 5.2 and make the confidence-interval
      check real.
      IT STAYS `uploaded`, AND STAYS A PLACEHOLDER UNTIL A FILE IS IN. The
      platform renders a structured SUMMARY here (SectionSpec.leaf_suffix
      "summary") which ships BESIDE the CRO's report rather than instead of it
      -- assembly otherwise lets an upload win over a rendered leaf at the same
      key, and the summary would vanish the moment the report arrived.
      Crediting the section as done because the summary renders would launder
      the one gap that matters most, so this leaf goes DONE only in
      `--project` mode, once the report is actually attached.
      Mutually exclusive with a 1.2.17 biowaiver for the same strength (R06).
    status: unknown

