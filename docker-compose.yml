services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: dossier
      POSTGRES_PASSWORD: dossier
      POSTGRES_DB: dossier
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./backend/scripts/init-pgvector.sql:/docker-entrypoint-initdb.d/init-pgvector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dossier"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # P1a: optional. The default converter ("libreoffice-listener") runs
  # LibreOffice inside the api container and needs nothing here. Gotenberg
  # exists for the deployment where LibreOffice should NOT live in the API
  # container -- a read-only image, separate scaling, a managed converter.
  #
  # Opt in with:  docker compose --profile gotenberg up
  #   and set DOCUMENT_CONVERTER=gotenberg (plus GOTENBERG_URL for the api
  #   container, which reaches it by service name, not localhost).
  gotenberg:
    image: gotenberg/gotenberg:8
    profiles: ["gotenberg"]
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:3000/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://dossier:dossier@db:5432/dossier
      S3_ENDPOINT_URL: http://minio:9000
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy

volumes:
  db_data:
  minio_data:
